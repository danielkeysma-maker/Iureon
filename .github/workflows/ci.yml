name: CI

on:
  push:
    branches: [main]
  pull_request:

# OJO AL ESCRIBIR EL NOMBRE DE UN PASO: si lleva «: » (dos puntos y espacio),
# YAML lo lee como un mapa y el archivo entero deja de ser valido. Cuando eso
# pasa, GitHub no reporta un check en rojo: reporta el flujo en FALLO SIN
# NINGUN TRABAJO, que es mucho mas dificil de leer —parecen fallar los checks
# cuando lo que falla es este archivo—. Ocurrio el 10 de septiembre de 2026 y
# tumbo tres empujes seguidos. Si el nombre necesita dos puntos, entrecomillalo.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The checks import catalog.service, which reaches config/env.config through
    # the verification store. That module fails fast when OPENROUTER_API_KEY is
    # absent — correct for the server, fatal for a check that never calls the
    # API. A placeholder satisfies the boot contract without granting anything.
    env:
      OPENROUTER_API_KEY: ci-placeholder-no-request-is-made
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # ── TODA LA SUITE, Y NO UNA LISTA A MANO ─────────────────────────────
      #
      # Aqui habia 34 pasos con nombre, uno por check. Se leian muy bien y
      # tenian un defecto que nadie veia: ENVEJECIAN. El 10 de septiembre de
      # 2026 se conto contra `package.json` y 22 de los 50 checks
      # deterministas del backend NO ESTABAN en la lista — entre ellos los de
      # facturacion, clientes, autenticacion y rutas—. Se escribieron, pasan
      # en local, y el CI llevaba meses sin correrlos.
      #
      # `run-all-checks.mjs` descubre los checks LEYENDO `package.json`, asi
      # que un check nuevo entra solo y ninguno se queda fuera por olvido.
      # Tambien conoce cuales salen a la red y los omite: una mala tarde del
      # Senado no puede poner rojo un repositorio que no esta roto.
      #
      # LO QUE SE PIERDE, dicho para que nadie lo eche de menos sin saber por
      # que: la atribucion por paso en la interfaz de GitHub. La compensa el
      # propio ejecutor, que imprime que check fallo y con que texto, y que
      # ademas caza la contradiccion entre el codigo de salida y el banner —
      # algo que 34 pasos sueltos no podian hacer.
      - name: Toda la suite determinista del backend (el ejecutor la descubre; ninguna se queda fuera)
        run: node scripts/run-all-checks.mjs

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Design tokens, interview guide and document format checks
        run: npm run check:tokens && npm run check:guion && npm run check:formato && npm run check:informe && npm run check:membrete && npm run check:marcas && npm run check:estructura && npm run check:diff && npm run check:calculadoras && npm run check:instruccion && npm run check:rama-candidata && npm run check:navegacion
      - name: Build
        run: npm run build

  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce module boundaries
        run: bash scripts/check-module-boundaries.sh
      - name: El propio flujo de CI es YAML valido
        run: bash scripts/check-ci-yaml.sh
      - name: Reject committed secrets
        run: bash scripts/check-secrets.sh
