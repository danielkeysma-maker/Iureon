name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The checks import catalog.service, which reaches config/env.config through
    # the verification store. That module fails fast when OPENROUTER_API_KEY is
    # absent — correct for the server, fatal for a check that never calls the
    # API. A placeholder satisfies the boot contract without granting anything.
    env:
      OPENROUTER_API_KEY: ci-placeholder-no-request-is-made
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Payment gateway guard (no forgeable webhook)
        run: npm run check:wompi
      - name: Catalogue correctness checks
        run: npm run check:catalog
      - name: Embeddings guard (no fabricated vectors)
        run: npm run check:embeddings
      - name: Legal search guard (no fabricated law)
        run: npm run check:search
      - name: Doctrine guard (no unsourced quote)
        run: npm run check:conceptos
      - name: Subprocessor register matches the running config
        run: npm run check:subprocessors
      - name: On-demand ruling fetch refuses what the Court does not have
        run: npm run check:ruling
      - name: Topic discovery cannot admit what the Court does not have
        run: npm run check:discovery
      - name: Facts triage cannot invent an actuación
        run: npm run check:triage
      - name: Period statement arithmetic is exact
        run: npm run check:extracto

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce module boundaries
        run: bash scripts/check-module-boundaries.sh
      - name: Reject committed secrets
        run: bash scripts/check-secrets.sh
