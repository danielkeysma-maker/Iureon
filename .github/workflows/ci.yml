name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The checks import catalog.service, which reaches config/env.config through
    # the verification store. That module fails fast when OPENROUTER_API_KEY is
    # absent — correct for the server, fatal for a check that never calls the
    # API. A placeholder satisfies the boot contract without granting anything.
    env:
      OPENROUTER_API_KEY: ci-placeholder-no-request-is-made
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Payment gateway guard (no forgeable webhook)
        run: npm run check:wompi
      - name: Plan rules (prices, extension from a future expiry, expiry states, module gating)
        run: npm run check:plan
      - name: Plan change rules (a different plan starts today, a renewal extends)
        run: npm run check:cambio-plan
      - name: Free trial rules (7 days, one seat, honeypot, per-address window)
        run: npm run check:trial
      - name: Operator support rules (firm deletion confirmation, self-delete, password floor)
        run: npm run check:admin-reglas
      - name: Self-service deletion rules (last user, last administrator, operator, typed firm name)
        run: npm run check:borrado
      - name: Person name rules (2-80 characters, trimmed, never empty)
        run: npm run check:nombre
      - name: Firm-defined actuaciones (slug, shadowing the catalogue, no term without source)
        run: npm run check:actuaciones-firma
      - name: Transactional mail (templates, subjects, cuenta de cobro PDF)
        run: npm run check:mail
      - name: Catalogue correctness checks
        run: npm run check:catalog
      - name: Actuaciones reachable by remisión carry their envelope and no borrowed deadline
        run: npm run check:remision
      - name: Embeddings guard (no fabricated vectors)
        run: npm run check:embeddings
      - name: Legal search guard (no fabricated law)
        run: npm run check:search
      - name: Doctrine guard (no unsourced quote)
        run: npm run check:conceptos
      - name: Subprocessor register matches the running config
        run: npm run check:subprocessors
      - name: On-demand ruling fetch refuses what the Court does not have
        run: npm run check:ruling
      - name: Topic discovery cannot admit what the Court does not have
        run: npm run check:discovery
      - name: Facts triage cannot invent an actuación
        run: npm run check:triage
      - name: Period statement arithmetic is exact
        run: npm run check:extracto
      - name: Herramientas calculators (holidays from statute, 1.5 x IBC, cuantia tiers, indexation)
        run: npm run check:tools
      - name: PDF reader works without the optional native canvas
        run: npm run check:pdf
      - name: Draft attachments (limits, block rendering, vision answer parsing)
        run: npm run check:adjuntos
      - name: The draft is the actuacion the lawyer chose, with or without a verified ficha
        run: npm run check:tipo
      - name: Drafting deadlines fit under the function cap and running out returns the reservation
        run: npm run check:plazos
      - name: Hearing questions (prompt sections, truncated JSON rescue, parameter validation)
        run: npm run check:preguntas
      - name: Agenda de terminos (when it warns, no repeats, refuses an ambiguous ficha)
        run: npm run check:agenda
      - name: Revision (the received-document report never fills in a term the document does not state)
        run: npm run check:revision
      - name: Taller (the chat over a received document never proposes edits to it)
        run: npm run check:taller
      - name: Sin nombre (a draft with no ficha never states an article, a term or an authority)
        run: npm run check:sin-nombre

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Design tokens, interview guide and document format checks
        run: npm run check:tokens && npm run check:guion && npm run check:formato && npm run check:informe && npm run check:membrete && npm run check:marcas && npm run check:estructura && npm run check:diff && npm run check:calculadoras && npm run check:instruccion && npm run check:rama-candidata
      - name: Build
        run: npm run build

  conventions:
    name: Project conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce module boundaries
        run: bash scripts/check-module-boundaries.sh
      - name: Reject committed secrets
        run: bash scripts/check-secrets.sh
