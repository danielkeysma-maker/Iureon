<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Home — Sección 05 · Productos (acordeón 5c)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   SECCIÓN 05 · PRODUCTOS — variante 5c "acordeón a pantalla completa"
   Reemplaza las tres bandas ancladas (Agua / Soltice / Hogar).

   Comportamiento
   · Desktop (≥900px): tres columnas. La activa crece a todo el ancho
     disponible; las otras quedan como lomo con el título en vertical.
     Se abre con hover, click, foco de teclado y flechas ←/→.
   · Móvil (<900px): cae a acordeón vertical apilado. Sin hover.
   · Respeta prefers-reduced-motion.

   Paleta cerrada — no añadir colores.
   Display: Satoshi 900 · UI: Inter · Datos: JetBrains Mono
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#07293D; --ink-2:#0A2C3D; --blue:#0A4D82; --cyan:#1F8AC9;
  --green:#5EA843; --lime:#7EC265; --paper:#F3F7FA; --muted:#5C6B78;
  --ease:cubic-bezier(.16,1,.3,1);
  --rail:108px;              /* ancho del lomo cerrado */
  --pad:clamp(20px,2.6vw,32px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E7EDF3;color:#1A2530;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--cyan)}
:focus-visible{outline:2.5px solid var(--lime);outline-offset:-4px}

/* ── Contenedor de sección ── */
.products{background:var(--ink);overflow:hidden}
.products__inner{max-width:1440px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}

/* ── Encabezado ── */
.products__head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:26px var(--pad);border-bottom:1px solid rgba(243,247,250,.14)}
.products__title{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.kicker{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
.products__h2{margin:0;font:900 clamp(21px,2.2vw,26px)/1 Satoshi,Inter,sans-serif;letter-spacing:-0.035em;color:#fff}
.products__hint{flex:none;font:500 12px/1 'JetBrains Mono',monospace;color:rgba(243,247,250,.45)}

/* ── Pista del acordeón ── */
.acc{flex:1 1 auto;min-height:0;display:flex}

/* ── Panel ── */
.panel{position:relative;min-width:0;overflow:hidden;display:flex;cursor:pointer;border:none;padding:0;
  text-align:left;font:inherit;color:inherit;appearance:none;
  flex:0 0 var(--rail);
  transition:flex .7s var(--ease),background .5s var(--ease);
  border-right:1px solid rgba(243,247,250,.14)}
.panel:last-child{border-right:none}
.panel--dark{background:var(--ink)}
.panel--dark.panel--alt{background:var(--ink-2)}
.panel--light{background:var(--paper);border-right-color:rgba(10,77,130,.14)}
.panel.is-open{flex:1 1 0%}

/* lomo cerrado: número arriba, título en vertical */
.panel__rail{flex:none;width:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:20px;padding:26px 0;transition:opacity .4s var(--ease)}
.panel.is-open .panel__rail{opacity:0;pointer-events:none}
.panel__n{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.18em;color:rgba(243,247,250,.3)}
.panel--light .panel__n{color:rgba(7,41,61,.3)}
.panel__vtitle{writing-mode:vertical-rl;white-space:nowrap;font:900 clamp(19px,1.8vw,25px)/1 Satoshi,Inter,sans-serif;
  letter-spacing:-0.02em;color:rgba(243,247,250,.5)}
.panel--light .panel__vtitle{color:rgba(7,41,61,.5)}
.panel:hover .panel__vtitle,.panel:focus-visible .panel__vtitle{color:#fff}
.panel--light:hover .panel__vtitle,.panel--light:focus-visible .panel__vtitle{color:var(--ink)}

/* contenido abierto */
.panel__body{flex:1 1 0;min-width:0;display:grid;grid-template-columns:1.15fr .85fr;
  opacity:0;transition:opacity .5s var(--ease)}
.panel.is-open .panel__body{opacity:1;transition-delay:.12s}
.panel__copy{min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:var(--pad)}
.panel__tag{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.panel--light .panel__tag{color:var(--blue)}
.panel__headline{margin:14px 0 0;font:900 clamp(28px,3.4vw,44px)/0.94 Satoshi,Inter,sans-serif;letter-spacing:-0.045em;
  color:#fff;max-width:16ch;text-wrap:balance}
.panel--light .panel__headline{color:var(--ink)}
.panel__lede{margin:14px 0 0;font:400 clamp(15px,1.2vw,16px)/1.55 Inter,sans-serif;color:rgba(243,247,250,.68);
  max-width:38ch;text-wrap:pretty}
.panel--light .panel__lede{color:rgba(7,41,61,.66)}

/* especificaciones */
.specs{display:flex;margin-top:24px;border-top:1px solid rgba(243,247,250,.18)}
.panel--light .specs{border-top-color:rgba(7,41,61,.16)}
.spec{flex:1 1 0;min-width:0;padding:16px 14px 0 0;border-right:1px solid rgba(243,247,250,.18)}
.panel--light .spec{border-right-color:rgba(7,41,61,.16)}
.spec:last-child{border-right:none}
.spec__v{display:block;font:700 clamp(17px,1.5vw,20px)/1 'JetBrains Mono',monospace;color:var(--lime)}
.panel--light .spec__v{color:var(--blue)}
.spec__k{display:block;margin-top:7px;font:500 11.5px/1.35 Inter,sans-serif;color:rgba(243,247,250,.68)}
.panel--light .spec__k{color:rgba(7,41,61,.66)}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:24px;
  background:var(--green);color:#fff;font:700 15px/1 Inter,sans-serif;padding:15px 20px;border-radius:99px;
  transition:all .3s var(--ease);box-shadow:0 2px 0 rgba(7,41,61,.2),0 14px 28px -16px rgba(94,168,67,1)}
.cta:hover{background:#4d9137;color:#fff;transform:translateY(-2px)}
.cta span{opacity:.75;font-weight:400}

/* media (slot de render de producto) */
.panel__media{min-width:0;position:relative;padding:var(--pad) var(--pad) var(--pad) 0}
.panel__media::before{content:"";position:absolute;left:10%;right:20%;bottom:8%;height:18px;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.6),transparent 70%)}
.panel--light .panel__media::before{background:radial-gradient(50% 50% at 50% 50%,rgba(7,41,61,.28),transparent 70%)}
.panel__media img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
/* placeholder mientras no hay render */
.panel__media--empty{display:flex;align-items:center;justify-content:center}
.panel__media--empty span{position:relative;font:500 12px/1.5 'JetBrains Mono',monospace;color:rgba(243,247,250,.35);
  text-align:center;border:1px dashed rgba(243,247,250,.22);border-radius:14px;padding:22px}
.panel--light .panel__media--empty span{color:rgba(7,41,61,.4);border-color:rgba(7,41,61,.2)}

/* ── Móvil: acordeón vertical ── */
@media (max-width:900px){
  .products__inner{min-height:0}
  .acc{flex-direction:column}
  .panel{flex:none;border-right:none;border-bottom:1px solid rgba(243,247,250,.14);
    transition:background .4s var(--ease)}
  .panel--light{border-bottom-color:rgba(10,77,130,.14)}
  .panel__rail{flex-direction:row;width:auto;justify-content:flex-start;align-items:center;gap:14px;padding:22px var(--pad)}
  .panel.is-open .panel__rail{opacity:1;pointer-events:auto}
  .panel__vtitle{writing-mode:horizontal-tb;font-size:22px}
  .panel{display:block}
  .panel__body{display:none;grid-template-columns:1fr}
  .panel.is-open .panel__body{display:grid}
  .panel__copy{padding:0 var(--pad) var(--pad)}
  .panel__media{height:220px;padding:0 var(--pad) var(--pad)}
  .cta{width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section class="products" id="productos" aria-labelledby="productos-h2">
  <div class="products__inner">

    <header class="products__head">
      <div class="products__title">
        <span class="kicker">05 / Productos</span>
        <h2 class="products__h2" id="productos-h2">Una casa, tres sistemas.</h2>
      </div>
      <span class="products__hint" aria-hidden="true">Hover para abrir</span>
    </header>

    <div class="acc" data-acc role="tablist" aria-label="Sistemas">

      <!-- ── 01 · AGUA ── -->
      <button class="panel panel--dark is-open" type="button" role="tab" aria-selected="true" data-panel>
        <span class="panel__rail">
          <span class="panel__n">01</span>
          <span class="panel__vtitle">Tratamiento de agua</span>
        </span>
        <span class="panel__body">
          <span class="panel__copy">
            <span class="panel__tag">Agua</span>
            <span class="panel__headline">Dejar de cargar cajas de agua.</span>
            <span class="panel__lede">Filtra donde tomas el agua: sedimento, cloro y sabor, con su propia llave en el fregadero.</span>
            <span class="specs">
              <span class="spec"><span class="spec__v">4</span><span class="spec__k">etapas en serie</span></span>
              <span class="spec"><span class="spec__v">12</span><span class="spec__k">meses de ciclo</span></span>
              <span class="spec"><span class="spec__v">NSF</span><span class="spec__k">componentes cert.</span></span>
            </span>
            <a class="cta" href="#evaluacion">Medir mi agua <span aria-hidden="true">→</span></a>
          </span>
          <span class="panel__media panel__media--empty">
            <!-- Sustituir por: <img src="cebilon.png" alt="Purificador Cebilon"> -->
            <span>cebilon.png<br>PNG transparente</span>
          </span>
        </span>
      </button>

      <!-- ── 02 · SOLTICE ENERGY ── -->
      <button class="panel panel--light" type="button" role="tab" aria-selected="false" data-panel>
        <span class="panel__rail">
          <span class="panel__n">02</span>
          <span class="panel__vtitle">Soltice Energy</span>
        </span>
        <span class="panel__body">
          <span class="panel__copy">
            <span class="panel__tag">Soltice Energy</span>
            <span class="panel__headline">Que el apagón no cambie la noche.</span>
            <span class="panel__lede">Paneles monocristalinos, inversor híbrido y batería de litio. Respaldo por circuitos, no promesas de ahorro.</span>
            <span class="specs">
              <span class="spec"><span class="spec__v">550</span><span class="spec__k">W por panel</span></span>
              <span class="spec"><span class="spec__v">8</span><span class="spec__k">kW inversor</span></span>
              <span class="spec"><span class="spec__v">10</span><span class="spec__k">kWh batería</span></span>
            </span>
            <a class="cta" href="#evaluacion">Evaluar mi casa <span aria-hidden="true">→</span></a>
          </span>
          <span class="panel__media panel__media--empty">
            <!-- Sustituir por: <img src="solar.png" alt="Panel, inversor y batería"> -->
            <span>solar.png<br>PNG transparente</span>
          </span>
        </span>
      </button>

      <!-- ── 03 · CUIDADO DEL HOGAR ── -->
      <button class="panel panel--dark panel--alt" type="button" role="tab" aria-selected="false" data-panel>
        <span class="panel__rail">
          <span class="panel__n">03</span>
          <span class="panel__vtitle">Cuidado del hogar</span>
        </span>
        <span class="panel__body">
          <span class="panel__copy">
            <span class="panel__tag">Hogar</span>
            <span class="panel__headline">La plomería que nadie ve hasta que falla.</span>
            <span class="panel__lede">Menos sarro en toda la casa, agua caliente continua y la misma ducha en los dos pisos.</span>
            <span class="specs">
              <span class="spec"><span class="spec__v">24</span><span class="spec__k">kW calentador</span></span>
              <span class="spec"><span class="spec__v">2</span><span class="spec__k">pisos cubiertos</span></span>
              <span class="spec"><span class="spec__v">0</span><span class="spec__k">tanque de espera</span></span>
            </span>
            <a class="cta" href="#evaluacion">Revisar mi plomería <span aria-hidden="true">→</span></a>
          </span>
          <span class="panel__media panel__media--empty">
            <!-- Sustituir por: <img src="hogar.png" alt="Calentador y ablandador"> -->
            <span>hogar.png<br>PNG transparente</span>
          </span>
        </span>
      </button>

    </div>
  </div>
</section>

<script>
(function () {
  var acc = document.querySelector('[data-acc]');
  if (!acc) return;
  var panels = Array.prototype.slice.call(acc.querySelectorAll('[data-panel]'));
  var isDesktop = function () { return matchMedia('(min-width:901px)').matches; };

  function open(i) {
    panels.forEach(function (p, n) {
      var on = n === i;
      p.classList.toggle('is-open', on);
      p.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  panels.forEach(function (p, i) {
    /* hover solo en desktop y solo en dispositivos con puntero fino */
    p.addEventListener('mouseenter', function () {
      if (isDesktop() && matchMedia('(hover:hover)').matches) open(i);
    });
    p.addEventListener('focus', function () { if (isDesktop()) open(i); });
    p.addEventListener('click', function () {
      /* en móvil funciona como acordeón: segundo toque cierra */
      if (!isDesktop() && p.classList.contains('is-open')) { open(-1); return; }
      open(i);
    });
    p.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); panels[(i + 1) % panels.length].focus(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); panels[(i - 1 + panels.length) % panels.length].focus(); }
    });
  });

  /* al pasar a móvil deja el primero abierto; al volver a desktop también */
  matchMedia('(min-width:901px)').addEventListener('change', function () { open(0); });
  open(0);
})();
</script>
</body>
</html>
