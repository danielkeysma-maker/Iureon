<li>Las dos actas abren con un bloque de <b>naturaleza del documento<\u002Fb> antes del contenido: transcripción automática, revisada por una persona con tarjeta profesional, con los tramos ininteligibles señalados y sin sustituir el acta oficial.<\u002Fli>
